name: Firebase Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Firebase preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy Firebase preview channel
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          output_file="${RUNNER_TEMP}/firebase-preview.json"
          npx --yes firebase-tools@15.32.1 hosting:channel:deploy \
            "pr-${{ github.event.pull_request.number }}" \
            --expires 7d \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --no-authorized-domains \
            --json > "${output_file}"

          cat "${output_file}"

          preview_url="$(node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const preview = Object.values(response.result ?? {}).find(
              (entry) => entry && typeof entry.url === "string",
            );
            if (!preview) {
              console.error("Firebase CLI response did not contain a preview URL.");
              process.exit(1);
            }
            process.stdout.write(preview.url);
          ' "${output_file}")"

          echo "preview_url=${preview_url}" >> "${GITHUB_OUTPUT}"

      - name: Add or update pull request comment
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- firebase-preview-comment -->';
            const previewUrl = process.env.PREVIEW_URL;
            const body = [
              marker,
              'Firebase Preview:',
              previewUrl,
              '',
              'This preview expires after 7 days.',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );

            const existingComment = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
